<style>

.ck:hover{border-color:#cfcbbf}
.ck.in{background:#eef1ff;border-color:#3d57e6;box-shadow:0 4px 0 #3d57e6}
.tx{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;font:700 15px 'DM Sans',sans-serif;color:#2a3fb8;cursor:pointer}

<div aria-label="Câu đang sắp xếp" style="min-height:120px;box-sizing:border-box;padding:18px;border-radius:18px;border:2px dashed #cfcbbf;background:#fff;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px">
<button class="ck in" type="button" aria-label="Bỏ The first item">The first item<span aria-hidden="true" style="color:#2a3fb8">×</span></button>

<button class="ck" type="button">is</button>

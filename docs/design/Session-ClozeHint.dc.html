<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chọn từ điền câu · gợi ý</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#f7f6f1}
a{color:inherit;text-decoration:none}
a:hover{color:#17181a}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.b1{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:14px;background:#17181a;color:#fff;font:700 16px 'DM Sans',sans-serif;box-shadow:0 4px 0 #45473f;border:0;cursor:pointer}
.b1:hover{color:#fff;transform:translateY(-1px)}
.b1:disabled{background:#e4e1d8;color:#5b5d57;box-shadow:0 4px 0 #cfcbbf;cursor:default;transform:none}
.ib{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;border:2px solid #e4e1d8;background:#fff;color:#17181a;box-shadow:0 3px 0 #e4e1d8;cursor:pointer;flex-shrink:0}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:14px 18px;box-sizing:border-box;border-radius:14px;border:2px solid #e4e1d8;background:#fff;box-shadow:0 4px 0 #e4e1d8;font:500 17px 'DM Sans',sans-serif;color:#17181a;text-align:left;cursor:pointer}
.opt:hover{border-color:#cfcbbf}
.num{width:30px;height:30px;border-radius:8px;border:2px solid #e4e1d8;display:grid;place-items:center;font-size:13px;font-weight:700;color:#5b5d57;flex-shrink:0;box-sizing:border-box}
.tx{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;font:700 15px 'DM Sans',sans-serif;color:#2a3fb8;cursor:pointer}
:focus-visible{outline:3px solid #3d57e6;outline-offset:3px}
</style>
</helmet>
<div style="min-height:900px;display:flex;flex-direction:column;background:#f7f6f1;color:#17181a;font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.55">

<header style="width:100%;max-width:760px;margin:0 auto;box-sizing:border-box;padding:20px 20px 0;display:flex;align-items:center;gap:18px">
<a href="Main.dc.html" aria-label="Tạm dừng và về trang chủ" style="width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:#5b5d57"><svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
<div role="progressbar" aria-label="Tiến độ phiên học" aria-valuemin="0" aria-valuemax="10" aria-valuenow="5" style="flex:1;height:14px;border-radius:99px;background:#e4e1d8;overflow:hidden"><div style="width:50%;height:100%;border-radius:99px;background:#d2f55d;box-shadow:inset 0 -4px 0 #b5d93a"><div style="margin:3px 8px 0;height:3px;border-radius:99px;background:#eefaa8"></div></div></div>
<span style="min-width:40px;font-weight:700;color:#5b5d57">5/10</span>
</header>

<main style="flex:1;width:100%;max-width:720px;margin:0 auto;box-sizing:border-box;padding:48px 20px 40px;display:flex;flex-direction:column;gap:24px">

<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<span style="display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:#eef1ff;color:#2a3fb8;font-size:12px;font-weight:700;letter-spacing:0.06em">CHỌN TỪ ĐIỀN CÂU</span>
<button class="ib" type="button" aria-label="Nghe câu hỏi"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6a1.4 1.4 0 0 1-1 .4H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6M19.4 18.4a9 9 0 0 0 0-12.8"/></svg></button>
</div>

<h1 style="margin:0;font:800 30px/1.35 Manrope,sans-serif;letter-spacing:-0.025em">We must move the workshop to next week. In other words, we must <span style="display:inline-block;min-width:96px;border-bottom:4px solid #17181a;color:transparent" aria-label="chỗ trống">___</span> it.</h1>

<div role="group" aria-label="Các đáp án" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<button class="opt" type="button" aria-pressed="false"><span class="num">1</span>attend</button>
<button class="opt" type="button" aria-pressed="false"><span class="num">2</span>prepare</button>
<button class="opt" type="button" aria-pressed="false"><span class="num">3</span>postpone</button>
<button class="opt" type="button" aria-pressed="false"><span class="num">4</span>describe</button>
</div>

<section aria-label="Gợi ý" style="display:flex;flex-direction:column;gap:12px;padding:18px 20px;border-radius:18px;background:#fff7dc;border:2px solid #f5e3a6">
<button class="tx" type="button"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></svg>Xem đáp án</button>
<div style="display:flex;gap:10px"><span style="flex-shrink:0;width:24px;height:24px;border-radius:99px;background:#ffcf3d;display:grid;place-items:center;font-size:12px;font-weight:700">1</span><p style="margin:0">To arrange for something to happen at a later time.</p></div>
<div style="display:flex;gap:10px"><span style="flex-shrink:0;width:24px;height:24px;border-radius:99px;background:#ffcf3d;display:grid;place-items:center;font-size:12px;font-weight:700">2</span><p lang="vi" style="margin:0">hoãn đến một thời điểm muộn hơn</p></div>
<p style="margin:0;font-size:13px;color:#7a5a00">Đã dùng gợi ý — lượt đúng sẽ được ghi là có hỗ trợ.</p>
</section>

</main>

<footer style="background:#fff;border-top:2px solid #ece9e1">
<div style="max-width:720px;margin:0 auto;box-sizing:border-box;padding:18px 20px 22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px">
<span id="hint-cta" style="font-size:14px;color:#5b5d57">Chọn một đáp án để kiểm tra.</span>
<button class="b1" type="button" disabled="disabled" aria-describedby="hint-cta">Kiểm tra đáp án</button>
</div>
</footer>

</div>
</x-dc>

</body>
</html>

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reflexvocab
      POSTGRES_USER: reflexvocab
      POSTGRES_PASSWORD: reflexvocab-local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./dev/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./dev/postgres/auth.sql:/dev-setup/auth.sql:ro
      - ./supabase/migrations:/dev-setup/migrations:ro
      - ./supabase/seed.sql:/dev-setup/seed.sql:ro
      - ./supabase/content:/dev-setup/content:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflexvocab -d reflexvocab"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
